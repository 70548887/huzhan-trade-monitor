services:
  web:
    image: huzhan-trade-monitor:local
    build: .
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      HUZHAN_ADMIN_USERNAME: ${HUZHAN_ADMIN_USERNAME:-admin}
      HUZHAN_ADMIN_PASSWORD: ${HUZHAN_ADMIN_PASSWORD:-}
      HUZHAN_COOKIE_SECURE: ${HUZHAN_COOKIE_SECURE:-0}
      HUZHAN_AUTO_COLLECT: ${HUZHAN_AUTO_COLLECT:-1}
    ports:
      - "127.0.0.1:8878:8878"
    volumes:
      - monitor_data:/app/data
      - monitor_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8878/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  monitor_data:
  monitor_logs:
