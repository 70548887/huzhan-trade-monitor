services:
  web:
    image: huzhan-trade-monitor:local
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8878:8878"
    volumes:
      - monitor_data:/app/data
      - monitor_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8878/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  collector:
    image: huzhan-trade-monitor:local
    build: .
    command: ["python", "-m", "huzhan_monitor.scheduler"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - monitor_data:/app/data
      - monitor_logs:/app/logs

volumes:
  monitor_data:
  monitor_logs:
