<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>登录 · 互站交易监控</title>
  <link rel="stylesheet" href="/static/style.css?v=0.2.0">
  <link rel="stylesheet" href="/static/account.css?v=0.2.0">
</head>
<body class="login-page">
  <main class="login-shell">
    <div class="login-brand">
      <div class="brand-mark" aria-hidden="true">互</div>
      <p class="eyebrow">HUZHAN TRADE MONITOR</p>
      <h1>互站交易监控</h1>
      <p class="subheading">登录后查看交易概览与运行日志</p>
    </div>
    <section class="card login-card" aria-labelledby="login-heading">
      <h2 id="login-heading">账户登录</h2>
      <p class="login-description">使用管理员账户访问你的监控数据。</p>
      {% if error %}
      <div class="warning error login-message" role="alert">{{ error }}</div>
      {% endif %}
      {% if not configured %}
      <div class="setup-message" role="status">
        <strong>尚未设置管理员</strong>
        <p>请在服务器的项目目录中创建管理员账户，完成后刷新此页面。</p>
        <code>python -m huzhan_monitor.admin --username admin</code>
        <p class="footnote">请使用运行本项目的 Python 环境。</p>
      </div>
      {% endif %}
      <form action="/login" method="post" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_path }}">
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="username" maxlength="64" value="{{ username|default('') }}" required{% if configured %} autofocus{% else %} disabled{% endif %}>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required{% if not configured %} disabled{% endif %}>
        <button type="submit" class="primary login-submit"{% if not configured %} disabled{% endif %}>登录</button>
      </form>
    </section>
    <p class="login-footer">监控数据仅向登录账户开放</p>
  </main>
</body>
</html>
